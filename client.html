<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Client Projects | Release Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#DD0031' }, fontFamily: { 'sans': ['Inter'] } } }
        }
    </script>
</head>
<body class="bg-slate-950 font-sans antialiased">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="hidden lg:flex w-72 bg-slate-900/95 border-r border-slate-800 fixed left-0 top-0 h-full z-20 flex-col">
            <div class="p-6 border-b border-slate-800">
                <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition">
                    <div class="h-10 w-10 bg-primary/10 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-rocket text-primary text-xl"></i>
                    </div>
                    <div><h1 class="text-lg font-bold text-white">Release Manager</h1><p class="text-xs text-slate-400">Deployment Control</p></div>
                </a>
            </div>
            <div class="flex-1 overflow-y-auto py-6 px-4">
                <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3 px-3">Clients</div>
                <div id="sidebarClients" class="space-y-1"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-72">
            <div class="max-w-7xl mx-auto p-6 md:p-8">
                <!-- Header -->
                <div class="mb-8">
                    <a href="index.html" class="text-primary hover:text-primary/80 text-sm mb-3 inline-flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> Back to Clients</a>
                    <h1 id="clientName" class="text-3xl md:text-4xl font-bold text-white mt-2">Loading...</h1>
                    <p class="text-slate-400 mt-1">Project Portfolio</p>
                </div>

                <!-- Search -->
                <div class="relative mb-6">
                    <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="projectSearch" placeholder="Search projects..." class="w-full pl-12 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500">
                </div>

                <!-- Projects Grid -->
                <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            </div>
        </main>
    </div>

    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
