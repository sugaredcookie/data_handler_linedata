<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Linedata Release Manager | Client-Centric Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#DD0031',
            secondary: '#0A2540',
            'deep-slate-950': '#090d16',
            'deep-slate-900': '#0f172a',
            'deep-slate-800': '#1e293b',
          },
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'premium': '0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05)',
            'card-glow': '0 0 25px -5px rgba(221, 0, 49, 0.15), 0 10px 20px -5px rgba(0, 0, 0, 0.3)',
          },
          animation: {
            'fade-in': 'fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
            'pulse-soft': 'pulseSoft 3s infinite ease-in-out',
          },
          keyframes: {
            fadeIn: { from: { opacity: '0', filter: 'blur(4px)' }, to: { opacity: '1', filter: 'blur(0)' } },
            slideUp: { from: { transform: 'translateY(20px)', opacity: '0' }, to: { transform: 'translateY(0)', opacity: '1' } },
            pulseSoft: { '0%, 100%': { opacity: '0.8' }, '50%': { opacity: '0.4' } }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-deep-slate-950 via-slate-950 to-slate-900 text-slate-100 font-sans antialiased min-h-screen selection:bg-primary/30 selection:text-white">

  <div class="fixed top-0 left-1/4 w-96 h-96 bg-primary/5 rounded-full filter blur-[120px] pointer-events-none animate-pulse-soft"></div>
  <div class="fixed bottom-10 right-10 w-80 h-80 bg-blue-500/5 rounded-full filter blur-[100px] pointer-events-none animate-pulse-soft" style="animation-delay: 1.5s;"></div>

  <div class="mobile-header-bar lg:hidden sticky top-0 z-30 bg-slate-900/80 border-b border-slate-800/80 px-5 py-3.5 flex items-center justify-between shadow-lg backdrop-blur-xl">
    <div class="flex items-center gap-3">
      <button id="mobileMenuBtn" class="text-primary text-xl p-2.5 rounded-xl bg-slate-800/60 border border-slate-700/50 hover:bg-slate-800 transition-all active:scale-95">
        <i class="fa-solid fa-bars-staggered"></i>
      </button>
      <div>
        <h2 class="font-bold text-white text-sm tracking-wide uppercase text-[11px] text-slate-400">Account Context</h2>
        <p id="mobileSelectedClient" class="text-sm text-primary font-bold tracking-tight">—</p>
      </div>
    </div>
    <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
      <i class="fa-solid fa-circle-nodes text-primary text-xs animate-pulse"></i>
      <span class="text-xs font-semibold tracking-wider uppercase text-slate-400">Hub-Active</span>
    </div>
  </div>

  <div id="mobileDrawerOverlay" class="fixed inset-0 bg-slate-950/80 z-40 backdrop-blur-md hidden transition-all duration-300 opacity-0"></div>
  <div id="mobileDrawer" class="fixed top-0 left-0 h-full w-80 bg-slate-900 z-50 border-r border-slate-800 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
    <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-950/40">
      <div class="flex items-center gap-2.5">
        <i class="fa-solid fa-rectangle-list text-primary text-lg"></i>
        <span class="font-bold text-white tracking-tight">Enterprise Portfolio</span>
      </div>
      <button id="closeDrawerBtn" class="h-8 w-8 rounded-lg flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-all">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
    <div id="mobileClientList" class="flex-1 overflow-y-auto p-4 space-y-1.5 custom-scrollbar"></div>
  </div>

  <div class="flex min-h-screen">
    
    <aside class="hidden lg:flex desktop-sidebar w-80 bg-slate-900/60 border-r border-slate-800/80 fixed left-0 top-0 h-full z-20 flex-col backdrop-blur-xl transition-all">
      <div class="p-6 border-b border-slate-800 bg-slate-950/20">
        <div class="flex items-center gap-3">
          <div class="h-10 w-10 bg-primary/10 border border-primary/20 rounded-xl flex items-center justify-center shadow-inner shadow-primary/20">
            <i class="fa-solid fa-network-wired text-primary text-lg"></i>
          </div>
          <div>
            <h1 class="text-md font-bold tracking-tight text-white">Client Registry</h1>
            <p class="text-[11px] text-slate-400 font-semibold uppercase tracking-wider">Release Context System</p>
          </div>
        </div>
      </div>
      
      <div class="flex-1 overflow-y-auto py-5 px-4 space-y-1 custom-scrollbar" id="desktopClientList"></div>
      
      <div class="p-4 bg-slate-950/40 border-t border-slate-800/80 text-[11px] font-bold tracking-wider text-slate-400 uppercase flex items-center justify-between">
        <span class="flex items-center gap-2"><i class="fa-solid fa-database text-slate-500"></i> Scope Registry</span>
        <span id="totalClientsBadge" class="bg-slate-800 text-slate-200 px-2 py-0.5 rounded-md border border-slate-700">0 loaded</span>
      </div>
    </aside>

    <main class="flex-1 lg:ml-80 transition-all duration-300 w-full overflow-x-hidden">
      <div class="max-w-7xl mx-auto p-5 md:p-8 space-y-8 animate-fade-in">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800/80 pb-6">
          <div>
            <h1 class="text-3xl md:text-4xl font-black text-white tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
              Application Manager
            </h1>
            <p class="text-slate-400 text-sm mt-1.5 flex items-center gap-2">
              <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
              </span>
              Operational Pipeline Node <span class="text-slate-700">•</span> Real‑time Deployment Telemetry
            </p>
          </div>
          
          <div class="self-start md:self-auto">
            <div class="text-xs font-mono bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl shadow-inner flex items-center gap-2.5">
              <i class="fa-solid fa-clock-rotate-left text-primary animate-spin" style="animation-duration: 4s;"></i>
              <span id="lastUpdated" class="text-slate-300 font-semibold tracking-wide">Connecting Node Pipeline...</span>
            </div>
          </div>
        </div>

        <div class="bg-slate-900/40 backdrop-blur-md rounded-2xl border border-slate-800/80 p-5 shadow-premium space-y-5 animate-slide-up">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <div class="relative group">
              <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm group-focus-within:text-primary transition-colors"></i>
              <input id="search" type="text" placeholder="Search operational keys..." 
                     class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800/80 rounded-xl focus:outline-none focus:border-primary/50 focus:ring-4 focus:ring-primary/10 text-sm placeholder-slate-500 text-white transition-all shadow-inner">
            </div>

            <div class="relative group">
              <i class="fa-solid fa-server absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs pointer-events-none group-focus-within:text-primary transition-colors"></i>
              <select id="environmentFilter" class="w-full appearance-none pl-10 pr-10 py-2.5 bg-slate-950 border border-slate-800/80 rounded-xl focus:outline-none focus:border-primary/50 focus:ring-4 focus:ring-primary/10 text-sm text-slate-300 font-medium transition-all shadow-inner cursor-pointer">
                <option value="ALL">All Cluster Environments</option>
                <option value="DEV">DEV Node Cluster</option>
                <option value="QA">QA Verification</option>
                <option value="UAT">UAT Stage Sandbox</option>
                <option value="PROD">PROD Core Live</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-[10px] pointer-events-none group-focus-within:rotate-180 transition-transform duration-300"></i>
            </div>

            <div class="relative group">
              <i class="fa-solid fa-heart-pulse absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs pointer-events-none group-focus-within:text-primary transition-colors"></i>
              <select id="statusFilter" class="w-full appearance-none pl-10 pr-10 py-2.5 bg-slate-950 border border-slate-800/80 rounded-xl focus:outline-none focus:border-primary/50 focus:ring-4 focus:ring-primary/10 text-sm text-slate-300 font-medium transition-all shadow-inner cursor-pointer">
                <option value="ALL">All Operational Status</option>
                <option value="Ready For Promotion">State: Ready For Promotion</option>
                <option value="Testing">State: Active Test Run</option>
                <option value="Live">State: Production Live</option>
                <option value="Development">State: Engineering Lab</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-[10px] pointer-events-none group-focus-within:rotate-180 transition-transform duration-300"></i>
            </div>

            <div class="relative group">
              <i class="fa-solid fa-code-commit absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs group-focus-within:text-primary transition-colors"></i>
              <input id="versionFilter" type="text" placeholder="Build Baseline SemVer (e.g. 2.1.0)" 
                     class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800/80 rounded-xl focus:outline-none focus:border-primary/50 focus:ring-4 focus:ring-primary/10 text-sm placeholder-slate-500 text-white transition-all shadow-inner">
            </div>
          </div>

          <div class="border-t border-slate-800/60 my-2"></div>

          <div class="flex flex-wrap items-center justify-end gap-3 pt-1">
            <button onclick="window.clearFilters()" 
                    class="px-4 py-2 rounded-xl bg-slate-800/80 border border-slate-700/50 hover:bg-slate-700 hover:text-white text-slate-300 text-xs font-bold uppercase tracking-wider transition-all active:scale-95 flex items-center gap-2">
              <i class="fa-solid fa-arrow-rotate-left text-slate-400"></i> Reset Filters
            </button>
            <button onclick="window.exportToCSV()" 
                    class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold uppercase tracking-wider transition-all active:scale-95 flex items-center gap-2 shadow-md shadow-emerald-900/20 border border-emerald-500/30">
              <i class="fa-solid fa-cloud-arrow-down"></i> Export Report (CSV)
            </button>
          </div>
        </div>

        <div id="applications" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-12 transition-all duration-500"></div>
      </div>
    </main>
  </div>

  <div id="detailsModal" class="hidden fixed inset-0 bg-slate-950/80 flex items-center justify-center z-50 backdrop-blur-md transition-all duration-300 opacity-0">
    <div class="bg-slate-900 rounded-2xl max-w-lg w-full mx-4 shadow-premium border border-slate-800 overflow-hidden transform scale-95 transition-transform duration-300 ease-out">
      
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/40">
        <div class="flex items-center gap-3">
          <div class="h-8 w-8 rounded-lg bg-primary/10 border border-primary/20 flex items-center justify-center">
            <i class="fa-solid fa-circle-nodes text-primary text-sm animate-pulse"></i>
          </div>
          <h2 id="modalAppName" class="text-lg font-bold tracking-tight text-white"></h2>
        </div>
        <button onclick="window.closeModal()" class="h-8 w-8 rounded-lg flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      
      <div id="modalContent" class="p-6 space-y-4 text-sm leading-relaxed text-slate-300 custom-scrollbar max-h-[60vh] overflow-y-auto"></div>
      
      <div class="px-6 py-4 bg-slate-950/40 border-t border-slate-800 flex justify-end">
        <button onclick="window.closeModal()" 
                class="px-4 py-2 bg-slate-800 border border-slate-700/60 hover:bg-slate-700 text-slate-200 text-xs font-bold uppercase tracking-wider rounded-xl transition-all">
          Dismiss View
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
