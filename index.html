<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Application Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#DD0031',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased">
  <div class="max-w-7xl mx-auto p-6 md:p-8">
    
    <div class="flex flex-col items-center justify-center text-center mb-10 border-b border-slate-200/60 dark:border-slate-800/60 pb-6">
      <h1 class="text-4xl font-extrabold text-primary mb-2 tracking-tight md:text-5xl">Application Management</h1>
      <p class="text-slate-500 dark:text-slate-400 text-lg md:text-xl font-medium flex items-center justify-center gap-2">
        <i class="fa-solid fa-layer-group text-slate-400 text-sm"></i> Linedata Platform <span class="text-slate-300 dark:text-slate-700">•</span> Promotion Portal
      </p>
    </div>

    <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border border-slate-200 dark:border-slate-800 rounded-2xl p-5 mb-8 shadow-md space-y-4">
      
      <div class="flex flex-wrap gap-4 items-center justify-between">
        
        <div class="relative flex-1 min-w-[280px]">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input id="search" type="text"
                 class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 text-sm placeholder-slate-400 transition-all shadow-sm"
                 placeholder="Filter by application identifier...">
        </div>

        <div class="relative min-w-[180px] w-full sm:w-auto">
          <select id="environmentFilter"
                  class="w-full appearance-none pl-4 pr-10 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 text-sm shadow-sm font-medium text-slate-700 dark:text-slate-200">
            <option value="ALL">All Environments</option>
            <option value="DEV">DEV Environment</option>
            <option value="QA">QA Staging</option>
            <option value="UAT">UAT Sandbox</option>
            <option value="PROD">PROD Production</option>
          </select>
          <span class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-xs">
            <i class="fa-solid fa-chevron-down"></i>
          </span>
        </div>

        <div class="relative min-w-[200px] w-full sm:w-auto">
          <select id="statusFilter"
                  class="w-full appearance-none pl-4 pr-10 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 text-sm shadow-sm font-medium text-slate-700 dark:text-slate-200">
            <option value="ALL">All Operational Statuses</option>
            <option value="Ready For Promotion">Ready For Promotion</option>
            <option value="Testing">Under testing</option>
            <option value="Live">Live / Operational</option>
            <option value="Development">Active Development</option>
          </select>
          <span class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-xs">
            <i class="fa-solid fa-chevron-down"></i>
          </span>
        </div>

        <div class="relative min-w-[150px] w-full sm:w-auto">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs">
            <i class="fa-solid fa-code-branch"></i>
          </span>
          <input id="versionFilter" type="text" placeholder="Build Version (e.g. 2.1)"
                 class="w-full pl-10 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 text-sm shadow-sm placeholder-slate-400 font-medium">
        </div>
      </div>

      <div class="border-t border-slate-200/60 dark:border-slate-800/60 my-2"></div>

      <div class="flex flex-col gap-4 pt-1 sm:flex-row sm:items-center sm:justify-between">
        
        <div id="lastUpdated" class="text-xs font-semibold tracking-wide text-slate-500 dark:text-slate-400 flex items-center gap-2 uppercase">
          <i class="fa-solid fa-circle-notch fa-spin text-primary"></i> Syncing Node telemetry...
        </div>
        
        <div class="flex items-center gap-3 justify-end w-full sm:w-auto">
          <button onclick="clearFilters()" 
                  class="w-full sm:w-auto px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg font-semibold transition-all active:scale-[0.98] text-xs uppercase tracking-wider flex items-center justify-center gap-2">
            <i class="fa-solid fa-arrow-rotate-left"></i> Reset Filters
          </button>
          
          <button onclick="exportToCSV()" 
                  class="w-full sm:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold transition-all active:scale-[0.98] text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-file-export"></i> Export CSV
          </button>
        </div>
      </div>
    </div>

    <div id="applications" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <div id="detailsModal" class="hidden fixed inset-0 bg-slate-950/60 flex items-center justify-center z-50 backdrop-blur-md transition-opacity duration-300">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-lg w-full mx-4 shadow-2xl overflow-hidden border border-slate-200/80 dark:border-slate-800/80 transform scale-95 transition-transform duration-300">
      
      <div class="px-6 py-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-900/50">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-circle-info text-primary text-xl"></i>
          <h2 id="modalAppName" class="text-xl font-bold tracking-tight text-slate-900 dark:text-white"></h2>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div id="modalContent" class="p-6 space-y-4 text-sm leading-relaxed text-slate-600 dark:text-slate-300"></div>
      
      <div class="px-6 py-4 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-200 dark:border-slate-800 flex justify-end">
        <button onclick="closeModal()" 
                class="px-5 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-bold uppercase tracking-wider hover:bg-slate-50 dark:hover:bg-slate-700/50 transition">
          Dismiss View
        </button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const timeBox = document.getElementById('lastUpdated');
      if(timeBox) {
        const now = new Date();
        timeBox.innerHTML = `
          <i class="fa-solid fa-circle-check text-emerald-500"></i> 
          <span>System Telemetry Sync: ${now.toLocaleDateString()} ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        `;
      }
    });
  </script>
</body>
</html>
