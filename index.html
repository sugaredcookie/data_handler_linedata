<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Release Manager | Octopus-Style Deployment Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#DD0031', secondary: '#0A2540' },
                    fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.5s ease-out', 'slide-up': 'slideUp 0.6s ease-out' },
                    keyframes: {
                        fadeIn: { from: { opacity: '0' }, to: { opacity: '1' } },
                        slideUp: { from: { transform: 'translateY(20px)', opacity: '0' }, to: { transform: 'translateY(0)', opacity: '1' } }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 font-sans antialiased">
    <!-- Mobile Header -->
    <div class="mobile-header lg:hidden fixed top-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-5 py-3 flex items-center justify-between shadow-lg">
        <button id="mobileMenuBtn" class="text-primary text-xl p-2 rounded-xl hover:bg-slate-800 transition">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-rocket text-primary"></i>
            <span class="font-bold text-white">Release Manager</span>
        </div>
        <div class="w-10"></div>
    </div>

    <!-- Mobile Drawer -->
    <div id="mobileDrawerOverlay" class="fixed inset-0 bg-black/70 z-40 hidden"></div>
    <div id="mobileDrawer" class="fixed top-0 left-0 h-full w-80 bg-slate-900 z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-5 border-b border-slate-800 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-briefcase text-primary text-xl"></i>
                <span class="font-bold text-white">Navigation</span>
            </div>
            <button id="closeDrawerBtn" class="text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-4">
            <div class="mb-6">
                <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3">Clients</div>
                <div id="mobileClientList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- Desktop Layout -->
    <div class="flex min-h-screen">
        <!-- Desktop Sidebar -->
        <aside class="desktop-sidebar hidden lg:flex w-72 bg-slate-900/95 border-r border-slate-800 fixed left-0 top-0 h-full z-20 flex-col shadow-xl">
            <div class="p-6 border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 bg-primary/10 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-rocket text-primary text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-white">Release Manager</h1>
                        <p class="text-xs text-slate-400">Deployment Control</p>
                    </div>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto py-6 px-4">
                <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3 px-3">Clients</div>
                <div id="desktopClientList" class="space-y-1"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-72">
            <div class="max-w-7xl mx-auto p-6 md:p-8">
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-8">
                    <div class="stats-card bg-gradient-to-br from-primary/10 to-slate-900 rounded-2xl p-5 border border-primary/20 bg-slate-900/50">
                        <div class="flex items-center justify-between">
                            <div><p class="text-slate-400 text-sm">Total Clients</p><p id="totalClients" class="text-3xl font-bold text-white mt-1">0</p></div>
                            <i class="fa-solid fa-building text-4xl text-primary/30"></i>
                        </div>
                    </div>
                    <div class="stats-card bg-gradient-to-br from-emerald-500/10 to-slate-900 rounded-2xl p-5 border border-emerald-500/20 bg-slate-900/50">
                        <div class="flex items-center justify-between">
                            <div><p class="text-slate-400 text-sm">Total Projects</p><p id="totalProjects" class="text-3xl font-bold text-white mt-1">0</p></div>
                            <i class="fa-solid fa-diagram-project text-4xl text-emerald-500/30"></i>
                        </div>
                    </div>
                    <div class="stats-card bg-gradient-to-br from-blue-500/10 to-slate-900 rounded-2xl p-5 border border-blue-500/20 bg-slate-900/50">
                        <div class="flex items-center justify-between">
                            <div><p class="text-slate-400 text-sm">Total Releases</p><p id="totalReleases" class="text-3xl font-bold text-white mt-1">0</p></div>
                            <i class="fa-solid fa-tag text-4xl text-blue-500/30"></i>
                        </div>
                    </div>
                    <div class="stats-card bg-gradient-to-br from-purple-500/10 to-slate-900 rounded-2xl p-5 border border-purple-500/20 bg-slate-900/50">
                        <div class="flex items-center justify-between">
                            <div><p class="text-slate-400 text-sm">Latest Deployment</p><p id="latestDeployment" class="text-sm font-semibold text-white mt-1">—</p></div>
                            <i class="fa-solid fa-calendar-week text-4xl text-purple-500/30"></i>
                        </div>
                    </div>
                </div>

                <!-- Search Bar -->
                <div class="mb-8">
                    <div class="relative">
                        <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="globalSearch" placeholder="Search by Client, Project, Release ID, or Version..." class="w-full pl-12 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary text-white placeholder-slate-500">
                    </div>
                </div>

                <!-- Clients Grid -->
                <div>
                    <h2 class="text-2xl font-bold text-white mb-5 flex items-center gap-2">
                        <i class="fa-solid fa-building text-primary"></i> Client Portfolio
                    </h2>
                    <div id="clientsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
