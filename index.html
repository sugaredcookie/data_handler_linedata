<!DOCTYPE html>
<html>
<head>
  <title>Application Management Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Application Management Portal</h1>

  <input
    type="text"
    id="search"

  <div id="applications"></div>

  <script src="app.js" defer></script>

</body>
</html>
