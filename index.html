<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Application Management Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#DD0031',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-8">
    
    <div class="flex justify-between items-start mb-10">
      <div class="text-center flex-1">
        <h1 class="text-5xl font-bold text-primary mb-2 tracking-tight">Application Management</h1>
        <p class="text-slate-600 dark:text-slate-400 text-xl">Linedata Platform • Promotion Portal</p>
      </div>
    </div>

    <div class="bg-white/40 dark:bg-slate-900/40 backdrop-blur-md border border-slate-200 dark:border-slate-800 rounded-3xl p-6 mb-8 shadow-xl space-y-4">
      
      <div class="flex flex-wrap gap-4 items-center justify-center lg:justify-start">
        <div class="relative flex-1 min-w-[280px] max-w-md">
          <input id="search" type="text"
                 class="w-full pl-12 pr-6 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 text-lg placeholder-slate-400 transition-all shadow-sm"
                 placeholder="Search applications...">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">🔍</span>
        </div>

        <select id="environmentFilter"
                class="px-5 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 shadow-sm font-medium">
          <option value="ALL">🌐 All Environments</option>
          <option value="DEV">🛠 DEV</option>
          <option value="QA">🔍 QA</option>
          <option value="UAT">🧪 UAT</option>
          <option value="PROD">🚀 PROD</option>
        </select>

        <select id="statusFilter"
                class="px-5 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 shadow-sm font-medium">
          <option value="ALL">All Statuses</option>
          <option value="Ready For Promotion">✅ Ready For Promotion</option>
          <option value="Testing">🧪 Testing</option>
          <option value="Live">🚀 Live</option>
          <option value="Development">🔨 Development</option>
        </select>

        <input id="versionFilter" type="text" placeholder="Version (e.g. 2.1)"
               class="px-5 py-3.5 w-48 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 shadow-sm placeholder-slate-400 font-medium">
      </div>

      <div class="border-t border-slate-200/60 dark:border-slate-800/60 my-2"></div>

      <div class="flex flex-wrap items-center justify-between gap-4 pt-1">
        <div id="lastUpdated" class="text-sm font-medium text-slate-500 dark:text-slate-400 flex items-center gap-2">
          <i class="fa-regular fa-clock text-primary"></i> Loading platform updates...
        </div>
        
        <div class="flex items-center gap-3 ml-auto">
          <button onclick="clearFilters()" 
                  class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl font-medium transition-all active:scale-95 text-sm">
            <i class="fa-solid fa-arrow-rotate-left mr-1.5"></i>Clear
          </button>
          
          <button onclick="exportToCSV()" 
                  class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium flex items-center gap-2 transition-all active:scale-95 text-sm shadow-md shadow-emerald-600/10">
            <i class="fas fa-download"></i> Export CSV
          </button>
        </div>
      </div>
    </div>

    <div id="applications" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <div id="detailsModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full mx-4 shadow-2xl overflow-hidden border border-slate-100 dark:border-slate-700">
      <div class="px-8 pt-8 pb-6 border-b dark:border-slate-700">
        <h2 id="modalAppName" class="text-3xl font-bold text-primary"></h2>
      </div>
      <div id="modalContent" class="p-8 space-y-6 text-slate-600 dark:text-slate-300"></div>
      <div class="flex border-t dark:border-slate-700">
        <button onclick="closeModal()" 
                class="flex-1 py-5 text-slate-600 dark:text-slate-400 font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition">
          Close
        </button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const timeBox = document.getElementById('lastUpdated');
      if(timeBox) {
        const now = new Date();
        timeBox.innerHTML = `<i class="fa-regular fa-clock text-primary"></i> Last checked: <span>${now.toLocaleDateString()} at ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
      }
    });
  </script>
</body>
</html>
